name: CI & E2E Validation

# Jobs run on the watt-mind org's self-hosted runner pool (labels:
# self-hosted, e2e -- runners watt-mind-shadow-1 / watt-mind-shadow-2), not
# GitHub-hosted ubuntu-latest: the org's GitHub-hosted Actions minutes are
# exhausted, so every ubuntu-latest job now fails at runner assignment
# (runner_id 0, no steps, no logs) regardless of the code under test.
# Note: `runs-on` matches runner *labels*, not runner names.

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Typecheck, Build & E2E Integration Test
    runs-on: [self-hosted, e2e]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build extension bundle
        run: npm run build

      - name: Run Vitest E2E Integration Tests
        run: npm test
        env:
          TEST_BASE_URL: https://coachwatts.com
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
